name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]      # pushing a tag like v1.0.0 publishes a downloadable release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # needed to create the GitHub Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Recurse "build/bufywave_artefacts/Release/VST3/bufywave.vst3" $dist
          $standalone = "build/bufywave_artefacts/Release/Standalone/bufywave.exe"
          if (Test-Path $standalone) { Copy-Item $standalone $dist }
          Compress-Archive -Path "$dist/*" -DestinationPath "bufywave-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bufywave-windows
          path: bufywave-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bufywave-windows.zip
          generate_release_notes: true
